# Builds the app as a hosted page and publishes it with GitHub Pages.
#
# NOT YET RUN. This file was written on 2026-09-29 and has never been run on
# GitHub. The build and its checks are the same commands that were run by hand.
#
# It runs only when started by hand from the Actions page. Publishing a page is
# a decision, so it is not tied to a push.
#
# Before the first run: in the repository's Settings, Pages, set the source to
# "GitHub Actions".
name: Hosted page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the pages are served under the repository's name
      - run: node scripts/build-hosted.mjs "/${{ github.event.repository.name }}"
      - run: node scripts/verify-hosted.mjs "/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out-hosted

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
